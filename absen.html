<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Dokter Jaga</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  :root{--pri:#0d6efd;--ok:#198754;--bad:#dc3545;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(#0f172a,#1e3a8a);color:#1e293b;min-height:100vh;}
  header{padding:20px 18px 8px;color:#fff;text-align:center;}
  header h1{margin:0;font-size:1.3rem;}
  header p{margin:6px 0 0;font-size:.85rem;color:#cbd5e1;}
  .wrap{max-width:420px;margin:0 auto;padding:18px;}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.2);}
  label{display:block;font-size:.85rem;font-weight:600;color:#334155;margin-bottom:6px;}
  select,input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem;margin-bottom:16px;}
  input#pin{letter-spacing:8px;text-align:center;font-size:1.4rem;font-weight:700;}
  .cam-box{position:relative;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px;}
  video,canvas{width:100%;display:block;}
  canvas{display:none;}
  .status-row{display:flex;gap:8px;align-items:center;font-size:.78rem;color:#64748b;margin-bottom:14px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex:0 0 auto;}
  .dot.ok{background:var(--ok);}
  .dot.bad{background:var(--bad);}
  button{width:100%;padding:16px;border:none;border-radius:10px;background:var(--pri);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer;}
  button:disabled{background:#94a3b8;cursor:not-allowed;}
  .muted{color:#64748b;}
  .msg{margin-top:14px;padding:14px;border-radius:10px;font-size:.9rem;text-align:center;display:none;white-space:pre-line;}
  .msg.show{display:block;}
  .msg.ok{background:#dcfce7;color:#166534;}
  .msg.bad{background:#fee2e2;color:#991b1b;}
  .clock{text-align:center;color:#cbd5e1;font-size:.8rem;margin-top:14px;}
  a.back{display:block;text-align:center;margin-top:18px;color:#cbd5e1;text-decoration:none;font-size:.85rem;}
</style>
</head>
<body>

<header>
  <h1>🩺 Absensi Dokter Jaga</h1>
  <p>Pilih nama, pilih status jaga hari ini, masukkan PIN, pastikan foto &amp; lokasi terverifikasi</p>
</header>

<div class="wrap">
  <div class="card">
    <label>Cari Nama Dokter</label>
    <input type="text" id="cariDokter" placeholder="Ketik nama untuk mencari..." autocomplete="off" style="margin-bottom:10px;">

    <label>Pilih Dokter</label>
    <select id="selDokter"><option value="">Memuat daftar dokter...</option></select>

    <div id="peranBox">
      <label>Status Jaga Hari Ini</label>
      <select id="selPeran">
        <option value="">-- Pilih status jaga --</option>
        <option value="IGD">IGD</option>
        <option value="Bangsal">Bangsal</option>
        <option value="Poli Umum">Poli Umum</option>
        <option value="Manajerial">Manajerial</option>
        <option value="Manajerial & Fungsional">Manajerial &amp; Fungsional</option>
        <option value="Spesialis (GF)">Spesialis (Guarantee Fee)</option>
      </select>
    </div>

    <label>PIN</label>
    <input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="••••">

    <label>Foto Bukti Kehadiran</label>
    <div class="cam-box">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="status-row"><span class="dot" id="dotCam"></span><span id="statCam">Menyiapkan kamera...</span></div>
    <div class="status-row"><span class="dot" id="dotGps"></span><span id="statGps">Mencari lokasi GPS...</span></div>

    <div style="display:flex;gap:10px;">
      <button id="btnAbsenMasuk" onclick="absen('masuk')" disabled style="background:var(--ok);">✅ Absen Masuk</button>
      <button id="btnAbsenKeluar" onclick="absen('keluar')" disabled style="background:var(--bad);">🚪 Absen Keluar</button>
    </div>
    <p class="muted" style="font-size:.75rem;text-align:center;margin-top:8px;">Pilih Absen Masuk kalau baru mulai jaga hari ini, atau Absen Keluar kalau mengakhiri jaga yang sedang berjalan.</p>

    <div class="msg" id="msg"></div>
    <p class="muted" id="fotoStatus" style="font-size:.78rem;text-align:center;margin:8px 0 0;"></p>
  </div>
  <div class="clock" id="clock"></div>
  <a class="back" href="index.html">← Kembali ke menu</a>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxH8s3CbHOs9Km09sFfwXUn3wMA502GQSU5fVjoxEUq70Gth5yL2YG0p_PbhG1--YKRhQ/exec';

let currentLat = null, currentLon = null, currentAcc = null;
let lokasiRS = null; // {lat, lon, radius, toleransi_akurasi} dari server
let camReady = false;

// TURBO: permintaan dibatasi waktu, supaya layar tidak "muter terus" kalau sinyal putus.
async function api(action, data, batasDetik) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), (batasDetik || 40) * 1000);
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data || {})), signal: ctrl.signal });
    const teks = await res.text();
    try { return JSON.parse(teks); }
    catch (x) {
      const judul = (teks.match(/<title>([^<]*)<\/title>/i) || [])[1] || '';
      throw new Error('Server Google sedang bermasalah' + (judul ? ' (' + judul + ')' : '') + '. Coba lagi sebentar.');
    }
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Koneksi lambat / terputus. Cek sinyal lalu coba lagi.');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function setMsg(text, cls) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + (cls || '');
}

let dokterKategoriMap = {};

function updateBtnState() {
  const idDokter = document.getElementById('selDokter').value;
  const peranOk = document.getElementById('selPeran').value;
  const dasarOk = idDokter && camReady;
  // Absen Keluar tidak butuh pilihan status jaga (peran ikut yang sudah tercatat saat masuk)
  document.getElementById('btnAbsenMasuk').disabled = !(dasarOk && peranOk);
  document.getElementById('btnAbsenKeluar').disabled = !dasarOk;
}

/* ===== Kamera (hanya ambil foto, tanpa AI/model — tidak butuh CDN eksternal) ===== */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 360 } });
    document.getElementById('video').srcObject = stream;
    camReady = true;
    document.getElementById('dotCam').className = 'dot ok';
    document.getElementById('statCam').textContent = 'Kamera siap';
  } catch (e) {
    document.getElementById('dotCam').className = 'dot bad';
    document.getElementById('statCam').textContent = 'Kamera tidak tersedia: ' + e.message;
    camReady = false;
  }
  updateBtnState();
}

function capturePhoto() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  // TURBO: foto diperkecil (lebar maks 400px, kualitas 60%) → ukuran unggah jauh lebih kecil,
  // absen lebih cepat terutama saat sinyal lemah. Wajah tetap jelas untuk bukti kehadiran.
  const vw = video.videoWidth || 480, vh = video.videoHeight || 360;
  const skala = Math.min(1, 400 / vw);
  canvas.width = Math.round(vw * skala);
  canvas.height = Math.round(vh * skala);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.6);
}

/* ===== GPS ===== */
function startGps() {
  if (!navigator.geolocation) {
    document.getElementById('dotGps').className = 'dot bad';
    document.getElementById('statGps').textContent = 'Perangkat tidak mendukung GPS';
    return;
  }
  navigator.geolocation.watchPosition(
    pos => {
      // Kalau HP mengirim beberapa posisi, simpan yang lebih akurat (atau yang terbaru bila sudah >20 dtk)
      const acc = pos.coords.accuracy;
      if (currentAcc === null || acc <= currentAcc + 10 || Date.now() - (window._gpsWaktu || 0) > 20000) {
        currentLat = pos.coords.latitude;
        currentLon = pos.coords.longitude;
        currentAcc = acc;
        window._gpsWaktu = Date.now();
      }
      tampilStatusGps();
    },
    err => {
      document.getElementById('dotGps').className = 'dot bad';
      document.getElementById('statGps').textContent = 'Gagal ambil lokasi: ' + err.message;
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function jarakMeter(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = d => d * Math.PI / 180;
  const a = Math.sin(r(lat2 - lat1) / 2) ** 2 + Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(r(lon2 - lon1) / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Tampilkan jarak ke RS & akurasi GPS, supaya dokter tahu sebelum menekan tombol absen.
function tampilStatusGps() {
  if (currentLat === null) return;
  const dot = document.getElementById('dotGps'), st = document.getElementById('statGps');
  const acc = Math.round(currentAcc);
  if (!lokasiRS) { dot.className = 'dot ok'; st.textContent = 'Lokasi terkunci (akurasi ±' + acc + ' m)'; return; }
  const jarak = Math.round(jarakMeter(lokasiRS.lat, lokasiRS.lon, currentLat, currentLon));
  const tol = Math.min(acc, lokasiRS.toleransi_akurasi || 100);
  if (jarak - tol <= lokasiRS.radius) {
    dot.className = 'dot ok';
    st.textContent = '✅ Di area RS (jarak ' + jarak + ' m, akurasi ±' + acc + ' m)';
  } else if (acc > (lokasiRS.toleransi_akurasi || 100)) {
    dot.className = 'dot bad';
    st.textContent = '⏳ GPS belum akurat (±' + acc + ' m, terbaca ' + jarak + ' m dari RS). Aktifkan Lokasi Akurat, nyalakan WiFi, dekati jendela & tunggu sebentar...';
  } else {
    dot.className = 'dot bad';
    st.textContent = '❌ Terbaca di luar area RS (jarak ' + jarak + ' m, batas ' + lokasiRS.radius + ' m)';
  }
}

/* ===== Dokter list ===== */
let dokterListFull = [];

function renderDokterOptions(list, keepSelected) {
  const sel = document.getElementById('selDokter');
  const prevValue = keepSelected ? sel.value : '';
  if (list.length) {
    sel.innerHTML = '<option value="">-- Pilih nama --</option>' +
      list.map(d => `<option value="${esc(d.id)}">${esc(d.nama)} (${esc(d.kategori)})</option>`).join('');
  } else {
    sel.innerHTML = '<option value="">Tidak ditemukan</option>';
  }
  // pertahankan dokter yang sudah dipilih kalau masih ada di hasil filter
  if (prevValue && list.some(d => d.id === prevValue)) {
    sel.value = prevValue;
  }
}

function filterDokter() {
  const q = document.getElementById('cariDokter').value.trim().toLowerCase();
  const filtered = q ? dokterListFull.filter(d => d.nama.toLowerCase().includes(q)) : dokterListFull;
  renderDokterOptions(filtered, true);
  updateBtnState();
}

function terapkanDaftarDokter(data, keepSelected) {
  dokterListFull = data;
  dokterKategoriMap = {};
  data.forEach(d => { dokterKategoriMap[d.id] = d.kategori; });
  const q = document.getElementById('cariDokter').value.trim().toLowerCase();
  renderDokterOptions(q ? data.filter(d => d.nama.toLowerCase().includes(q)) : data, keepSelected);
  updateBtnState();
}

// TURBO: daftar dokter langsung tampil dari simpanan perangkat (tanpa menunggu server),
// lalu diperbarui diam-diam di belakang layar dari server.
const KUNCI_SIMPAN = 'siabsen_dokter_v3';
async function loadDokterList() {
  const sel = document.getElementById('selDokter');
  let adaSimpanan = false;
  try { lokasiRS = JSON.parse(localStorage.getItem('siabsen_lokasi_rs') || 'null'); } catch (e) {}
  try {
    const simpan = JSON.parse(localStorage.getItem(KUNCI_SIMPAN) || 'null');
    if (simpan && Array.isArray(simpan) && simpan.length) { terapkanDaftarDokter(simpan, false); adaSimpanan = true; }
  } catch (e) { /* penyimpanan perangkat tidak tersedia — lanjut ambil dari server */ }
  try {
    const j = await api('getDokterList');
    if (j.ok && j.lokasi) {
      lokasiRS = j.lokasi;
      try { localStorage.setItem('siabsen_lokasi_rs', JSON.stringify(j.lokasi)); } catch (e) {}
      tampilStatusGps();
    }
    if (j.ok && j.data.length) {
      terapkanDaftarDokter(j.data, true);
      try { localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(j.data)); } catch (e) {}
    } else if (!adaSimpanan) {
      dokterListFull = [];
      sel.innerHTML = '<option value="">Tidak ada dokter aktif</option>';
    }
  } catch (e) {
    if (!adaSimpanan) {
      sel.innerHTML = '<option value="">Gagal memuat, coba muat ulang halaman</option>';
      setMsg('Gagal memuat daftar dokter: ' + e.message, 'bad');
    }
  }
  updateBtnState();
}
document.getElementById('cariDokter').addEventListener('input', filterDokter);

// TURBO: "bangunkan" server Google saat dokter mulai mengisi PIN, supaya ketika tombol
// absen ditekan server sudah siap (server yang tertidur butuh 1–3 detik untuk bangun).
let terakhirKontakServer = Date.now();
function pemanasServer() {
  if (Date.now() - terakhirKontakServer < 60000) return;
  terakhirKontakServer = Date.now();
  api('ping', {}, 15).catch(() => {});
}
document.getElementById('pin').addEventListener('focus', pemanasServer);
document.getElementById('selDokter').addEventListener('change', pemanasServer);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pemanasServer(); });
document.getElementById('selDokter').addEventListener('change', () => {
  const idDokter = document.getElementById('selDokter').value;
  const defaultKat = dokterKategoriMap[idDokter];
  const selPeran = document.getElementById('selPeran');
  if (defaultKat && Array.from(selPeran.options).some(o => o.value === defaultKat)) {
    selPeran.value = defaultKat;
  }
  updateBtnState();
});
document.getElementById('selPeran').addEventListener('change', updateBtnState);

/* ===== Absen ===== */
// mode: 'masuk' atau 'keluar' — dua tombol terpisah supaya dokter tidak salah pencet,
// server tetap memvalidasi ulang (kalau mode tidak cocok status sesi, akan ditolak dengan pesan jelas).
function buatReqId() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
const tunda = ms => new Promise(r => setTimeout(r, ms));

// TURBO tahap 2: foto bukti diunggah di belakang layar setelah absen tersimpan.
// Dicoba sampai 3x; dokter tidak perlu menunggu bagian ini.
async function unggahFotoLatar(token, fotoBase64) {
  const el = document.getElementById('fotoStatus');
  el.textContent = '📷 Mengunggah foto bukti...';
  for (let i = 0; i < 3; i++) {
    try {
      const j = await api('uploadFotoAbsen', { foto_token: token, foto_base64: fotoBase64 }, 60);
      if (j.ok) { el.textContent = '📷 Foto bukti tersimpan ✅'; return; }
      if (/kedaluwarsa|tidak valid|tidak ditemukan/.test(j.error || '')) break;
    } catch (e) { /* sinyal putus → coba lagi */ }
    await tunda(3000 * (i + 1));
  }
  el.textContent = '📷 Foto bukti gagal terunggah (absen tetap tercatat). Admin akan melihat keterangan ini.';
}

// mode: 'masuk' atau 'keluar' — dua tombol terpisah supaya dokter tidak salah pencet,
// server tetap memvalidasi ulang (kalau mode tidak cocok status sesi, akan ditolak dengan pesan jelas).
async function absen(mode) {
  const idDokter = document.getElementById('selDokter').value;
  const pin = document.getElementById('pin').value;
  const peran = document.getElementById('selPeran').value;
  if (!idDokter) return setMsg('Pilih nama dokter dahulu', 'bad');
  if (mode === 'masuk' && !peran) return setMsg('Pilih dulu status jaga hari ini (IGD/Bangsal/Poli Umum/Manajerial/Manajerial & Fungsional/Spesialis GF)', 'bad');
  if (!pin) return setMsg('Masukkan PIN', 'bad');
  if (!camReady) return setMsg('Kamera belum siap', 'bad');
  if (currentLat === null || currentLon === null) return setMsg('Lokasi GPS belum terkunci, tunggu sebentar', 'bad');

  document.getElementById('btnAbsenMasuk').disabled = true;
  document.getElementById('btnAbsenKeluar').disabled = true;
  document.getElementById('fotoStatus').textContent = '';
  let labelProses = 'Menyimpan ' + (mode === 'masuk' ? 'Absen Masuk' : 'Absen Keluar') + '...';
  setMsg(labelProses, '');
  const mulai = Date.now();
  const detik = setInterval(() => setMsg(labelProses + ' (' + Math.round((Date.now() - mulai) / 1000) + ' dtk)', ''), 1000);

  const fotoBase64 = capturePhoto();
  // req_id yang sama dipakai saat mencoba ulang → server tidak akan mencatat absen dobel
  const data = { id_dokter: idDokter, pin, peran, mode, lat: currentLat, lon: currentLon, akurasi: currentAcc, foto_tunda: true, req_id: buatReqId() };

  try {
    let j = null, errTerakhir = null;
    for (let i = 0; i < 3 && !j; i++) {
      try {
        j = await api('recordAbsen', data, 30);
        terakhirKontakServer = Date.now();
      } catch (e) {
        errTerakhir = e;
        labelProses = 'Sinyal lemah, mencoba lagi (' + (i + 2) + '/3)...';
        await tunda(1500);
      }
    }
    clearInterval(detik);
    if (!j) throw errTerakhir || new Error('Tidak ada jawaban dari server');
    if (j.ok) {
      const label = j.mode === 'masuk' ? 'ABSEN MASUK' : 'ABSEN KELUAR';
      let detail = `${label} berhasil — ${j.nama}\n${j.kategori} / ${j.shift}\nJam: ${j.jam}`;
      if (j.mode === 'keluar') detail += `\nDurasi: ${j.durasi_jam} jam`;
      detail += `\nJarak dari RS: ${j.jarak_meter} m (akurasi GPS ±${Math.round(currentAcc)} m)`;
      detail += `\nNominal: Rp ${Number(j.nominal || 0).toLocaleString('id-ID')}`;
      if (j.keterangan) detail += `\n⚠️ ${j.keterangan}`;
      detail += `\n⚡ tersimpan dalam ${((Date.now() - mulai) / 1000).toFixed(1)} detik`;
      setMsg(detail, j.telat_menit > 0 ? 'bad' : 'ok');
      document.getElementById('pin').value = '';
      document.getElementById('selPeran').value = '';
      if (j.foto_token && fotoBase64) unggahFotoLatar(j.foto_token, fotoBase64);
    } else {
      setMsg(j.error || 'Gagal memproses absensi', 'bad');
    }
  } catch (e) {
    setMsg('Gagal terhubung ke server: ' + e.message + '\nSilakan tekan tombol lagi — absen tidak akan tercatat dobel.', 'bad');
  } finally {
    clearInterval(detik);
    updateBtnState();
  }
}

function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'medium' });
}
setInterval(tickClock, 1000); tickClock();

startCamera();
startGps();
loadDokterList();
</script>
</body>
</html>
